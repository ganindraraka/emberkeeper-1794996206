<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberkeeper — keep the hearth through ten waves of night</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d16; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud by screen readers, never shown. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberkeeper: swing the arc shield around the hearth to catch embers, deflect frost shards, and dash past void shades through ten waves to dawn"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
